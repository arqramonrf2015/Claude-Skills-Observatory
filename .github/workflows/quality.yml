name: Portal quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      - run: python scripts/catalog/validate_skills.py
      - run: python scripts/benchmark/validate_results.py
      - run: python scripts/benchmark/generate_rankings.py
      - run: python scripts/benchmark/export_dashboard_data.py
      - run: python scripts/portal/build_portal_data.py
      - run: mkdocs build --strict

name: Skills catalog

on:
  pull_request:
    paths:
      - "data/skills/**"
      - "schema/**"
      - "scripts/catalog/**"
      - "docs/en/skills/**"
      - "docs/pt/skills/**"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "data/skills/**"
      - "schema/**"
      - "scripts/catalog/**"
      - "docs/en/skills/**"
      - "docs/pt/skills/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog
        run: python scripts/catalog/validate_skills.py
      - name: Regenerate catalog pages
        run: python scripts/catalog/generate_skill_index.py
      - name: Confirm generated files are current
        run: git diff --exit-code

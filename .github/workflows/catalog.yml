name: Skills catalog

on:
  pull_request:
    paths:
      - "data/skills/**"
      - "schema/**"
      - "scripts/catalog/**"
      - "dashboards/skills/**"
      - "docs/assets/data/skills.json"
      - ".github/workflows/catalog.yml"
  push:
    branches:
      - main
    paths:
      - "data/skills/**"
      - "schema/**"
      - "scripts/catalog/**"
      - "dashboards/skills/**"
      - "docs/assets/data/skills.json"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate catalog
        run: python scripts/catalog/validate_skills.py

      - name: Regenerate catalog data
        run: python scripts/catalog/generate_skill_index.py

      - name: Synchronize portal data
        run: python scripts/portal/build_portal_data.py

      - name: Confirm generated data is current
        run: |
          git diff --exit-code --             dashboards/skills/data/skills-catalog.json             docs/assets/data/skills.json
